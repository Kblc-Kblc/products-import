# Rate limit for starting imports, per client IP
limit_req_zone $binary_remote_addr zone=imports:10m rate=10r/m;
# Brute-force protection for login
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    client_max_body_size 20m;

    location /api/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    }

    # Only POST hits this exact path; status polling (/api/imports/{id}) is not limited
    location = /api/imports {
        limit_req zone=imports burst=5 nodelay;
        limit_req_status 429;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    }

    # Swagger UI + OpenAPI spec
    location /api/docs/ {
        alias /srv/docs/;
        index index.html;
    }

    # Product images downloaded during import
    location /storage/ {
        alias /srv/storage/;
    }

    # Angular SPA: unknown paths fall back to index.html for client-side routing
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
