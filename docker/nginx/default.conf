server {
    listen 80;
    client_max_body_size 20m;

    location /api/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    }

    # Product images downloaded during import
    location /storage/ {
        alias /srv/storage/;
    }
}
